<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>swapp · Conductor</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #e8e8e6;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }

    :root {
      --swapp: linear-gradient(to right,#8C085E,#A60842,#F2071B,#F2490C,#F27507);
      --red:   #F2071B;
      --orange:#F27507;
      --purple:#8C085E;
      --bg:    #f7f7f5;
      --card:  #ffffff;
      --border:#ebebeb;
      --muted: #888;
      --text:  #1a1a1a;
    }

    /* ── PHONE FRAME ── */
    .phone-wrap {
      background: #111; border-radius: 54px; padding: 14px;
      box-shadow: 0 40px 80px rgba(0,0,0,.4), 0 0 0 8px #222;
    }
    .notch-row { display:flex; justify-content:center; padding:6px 0 8px; }
    .notch-pill {
      width:110px; height:22px; background:#1c1c1c; border-radius:999px;
      display:flex; align-items:center; justify-content:center; gap:6px;
    }
    .notch-dot { width:8px;  height:8px;  background:#2d2d2d; border-radius:50%; }
    .notch-cam { width:10px; height:10px; background:#2d2d2d; border-radius:50%; }

    .phone-screen {
      width:362px; height:760px;
      background: var(--bg);
      border-radius:40px; overflow:hidden;
      position:relative; display:flex; flex-direction:column;
    }
    .home-bar-row { display:flex; justify-content:center; padding:10px 0 5px; }
    .home-bar { width:110px; height:4px; background:#333; border-radius:99px; }

    .status-bar {
      padding:10px 20px 4px;
      display:flex; justify-content:space-between; align-items:center;
      font-size:12px; font-weight:700;
      background:transparent; flex-shrink:0;
    }

    /* ── HEADER ── */
    .app-header {
      background: linear-gradient(to right,#8C085E,#A60842,#F2071B,#F2490C,#F27507);
      padding:12px 16px 10px; flex-shrink:0;
    }
    .header-top { display:flex; align-items:center; justify-content:space-between; }
    .logo { font-size:20px; font-weight:900; color:#fff; letter-spacing:-.5px; }
    .logo span { color:#F27507; }
    .header-role {
      font-size:10px; font-weight:700; color:rgba(255,255,255,.75);
      background:rgba(255,255,255,.18); border-radius:20px; padding:3px 10px;
    }
    .header-meta {
      display:flex; align-items:center; gap:8px; margin-top:8px;
    }
    .route-pill {
      font-size:11px; font-weight:700; color:#fff;
      background:rgba(255,255,255,.2); border-radius:20px; padding:4px 10px;
      display:flex; align-items:center; gap:5px;
    }
    .voice-status {
      margin-left:auto; font-size:11px; font-weight:700; color:#F27507;
      display:flex; align-items:center; gap:5px;
    }
    .voice-dot {
      width:7px; height:7px; background:#F27507; border-radius:50%;
      animation: blink 1.4s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

    /* ── SCROLL AREA ── */
    .scroll-area { overflow-y:auto; flex:1; padding:0 0 8px; }
    .scroll-area::-webkit-scrollbar { display:none; }

    /* ── STATS ROW ── */
    .stats-row {
      display:grid; grid-template-columns:repeat(3,1fr);
      gap:8px; padding:12px 14px 8px;
    }
    .stat-card {
      background:var(--card); border-radius:12px;
      border:1px solid var(--border);
      padding:10px 8px; text-align:center;
    }
    .stat-num { font-size:20px; font-weight:900; line-height:1; }
    .stat-label { font-size:9px; font-weight:700; color:var(--muted); margin-top:3px; text-transform:uppercase; letter-spacing:.04em; }

    /* ── SECTION LABEL ── */
    .section-lbl {
      font-size:10px; font-weight:800; color:var(--muted);
      text-transform:uppercase; letter-spacing:.08em;
      padding:8px 14px 4px;
    }

    /* ── ALERT CARD ── */
    .alert-card {
      margin:0 10px 10px;
      background:var(--card); border-radius:16px;
      border:1.5px solid var(--border);
      overflow:hidden; transition:box-shadow .2s;
    }
    .alert-card.critico { border-color:#F2071B; }
    .alert-card.aviso   { border-color:#F27507; }
    .alert-card.ok      { border-color:#22c55e; }

    .alert-top {
      padding:12px 14px 10px;
      display:flex; gap:10px; align-items:flex-start;
    }
    .stop-num {
      width:36px; height:36px; border-radius:10px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:15px; font-weight:900; color:#fff;
    }
    .stop-num.critico { background:linear-gradient(135deg,#8C085E,#F2071B); }
    .stop-num.aviso   { background:linear-gradient(135deg,#F2490C,#F27507); }
    .stop-num.ok      { background:#22c55e; }

    .alert-info { flex:1; }
    .alert-cliente { font-size:13px; font-weight:800; margin-bottom:2px; }
    .alert-cedis   { font-size:10px; color:var(--muted); font-weight:600; }

    .alert-badge {
      font-size:9px; font-weight:800; padding:3px 8px; border-radius:20px;
      white-space:nowrap;
    }
    .badge-critico { background:#fff0f0; color:#F2071B; border:1px solid #ffd0d0; }
    .badge-aviso   { background:#fff8f0; color:#F27507; border:1px solid #ffe0c0; }
    .badge-ok      { background:#f0fdf4; color:#16a34a; border:1px solid #bbf7d0; }

    /* Risk bar */
    .risk-row { padding:0 14px 8px; display:flex; align-items:center; gap:8px; }
    .risk-bar-bg {
      flex:1; height:6px; background:#f0f0f0; border-radius:99px; overflow:hidden;
    }
    .risk-bar-fill { height:100%; border-radius:99px; transition:width .6s; }
    .risk-pct { font-size:10px; font-weight:800; }

    /* Detail row */
    .detail-row {
      padding:0 14px 10px;
      font-size:11px; color:var(--muted); line-height:1.5; font-weight:600;
    }
    .detail-row strong { color:var(--text); }

    /* Product substitution row */
    .sust-row {
      margin:0 14px 10px;
      background:#fff8f0; border:1px solid #ffe4c0;
      border-radius:10px; padding:8px 10px;
      display:flex; align-items:center; gap:8px;
      font-size:11px; font-weight:700;
    }
    .sust-arrow { font-size:16px; }

    /* Action buttons */
    .action-row { display:flex; gap:8px; padding:0 14px 14px; }
    .btn-voice {
      flex:1; border:none; border-radius:10px; padding:9px 10px;
      font-size:11px; font-weight:800; cursor:pointer;
      display:flex; align-items:center; justify-content:center; gap:6px;
      font-family:inherit;
      background: linear-gradient(to right,#8C085E,#F2071B);
      color:#fff; transition:opacity .15s;
    }
    .btn-voice:active { opacity:.8; }
    .btn-voice.playing { background:linear-gradient(to right,#22c55e,#16a34a); }

    .btn-apartar {
      border:1.5px solid #F2071B; border-radius:10px; padding:9px 10px;
      font-size:11px; font-weight:800; cursor:pointer;
      display:flex; align-items:center; justify-content:center; gap:6px;
      font-family:inherit; background:#fff0f0; color:#F2071B;
      transition:all .15s;
    }
    .btn-apartar.done {
      background:#f0fdf4; border-color:#16a34a; color:#16a34a;
    }
    .btn-apartar:active { opacity:.8; }

    .btn-wa {
      border:none; border-radius:10px; padding:9px 10px;
      font-size:11px; font-weight:800; cursor:pointer;
      display:flex; align-items:center; justify-content:center; gap:5px;
      font-family:inherit; background:#25D366; color:#fff;
      transition:opacity .15s;
    }
    .btn-wa:active { opacity:.8; }
    .btn-wa.sending { background:#aaa; }

    /* ── VOICE OVERLAY (alerta de voz activa) ── */
    .voice-overlay {
      position:absolute; inset:0; z-index:200;
      background:rgba(0,0,0,.72);
      display:none; flex-direction:column;
      align-items:center; justify-content:center; gap:16px;
      border-radius:inherit;
    }
    .voice-overlay.active { display:flex; }

    .voice-wave {
      display:flex; gap:5px; align-items:center; height:48px;
    }
    .wave-bar {
      width:5px; background:#fff; border-radius:99px;
      animation: wave 1s ease-in-out infinite;
    }
    .wave-bar:nth-child(1){ height:18px; animation-delay:0s; }
    .wave-bar:nth-child(2){ height:32px; animation-delay:.1s; }
    .wave-bar:nth-child(3){ height:44px; animation-delay:.2s; }
    .wave-bar:nth-child(4){ height:28px; animation-delay:.3s; }
    .wave-bar:nth-child(5){ height:40px; animation-delay:.4s; }
    .wave-bar:nth-child(6){ height:22px; animation-delay:.5s; }
    .wave-bar:nth-child(7){ height:36px; animation-delay:.15s; }
    @keyframes wave {
      0%,100%{ transform:scaleY(1); }
      50%     { transform:scaleY(.4); }
    }

    .voice-card {
      background:#fff; border-radius:20px;
      padding:20px 22px; width:300px; text-align:center;
    }
    .voice-icon { font-size:36px; margin-bottom:8px; }
    .voice-title { font-size:15px; font-weight:900; margin-bottom:6px; }
    .voice-msg { font-size:12px; color:var(--muted); line-height:1.5; font-weight:600; margin-bottom:14px; }
    .voice-close {
      width:100%; padding:10px; border:none; border-radius:10px;
      background:linear-gradient(to right,#8C085E,#F2071B);
      color:#fff; font-size:13px; font-weight:800; cursor:pointer; font-family:inherit;
    }

    /* ── TOAST ── */
    .toast {
      position:absolute; bottom:68px; left:50%;
      transform:translateX(-50%) translateY(50px);
      background:#111; color:#fff;
      padding:8px 16px; border-radius:20px;
      font-size:11px; font-weight:700; z-index:300;
      transition:transform .25s ease; white-space:nowrap;
      pointer-events:none;
    }
    .toast.show { transform:translateX(-50%) translateY(0); }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      display:flex; border-top:1px solid var(--border);
      background:#fff; padding:8px 0 10px; flex-shrink:0;
    }
    .bottom-tab {
      flex:1; display:flex; flex-direction:column; align-items:center;
      gap:3px; cursor:pointer; font-size:9px; font-weight:700;
      color:var(--muted); padding:4px 0; text-transform:uppercase; letter-spacing:.04em;
    }
    .bottom-tab.active { color:#F2071B; }
    .bottom-tab svg { width:20px; height:20px; }

    /* ── DEMO LABEL ── */
    .demo-label {
      text-align:center; font-size:11px; font-weight:700;
      color:#666; margin-top:14px; letter-spacing:.5px;
    }
    .demo-label span {
      background:linear-gradient(to right,#8C085E,#F27507);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      font-weight:900;
    }

    /* ── SHIMMER for loading ── */
    @keyframes shimmer {
      0%   { background-position:-300px 0; }
      100% { background-position:300px 0; }
    }
    .shimmer {
      background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);
      background-size:600px 100%;
      animation:shimmer 1.2s infinite;
      border-radius:8px;
    }
  </style>
</head>
<body>

<div>
  <div class="phone-wrap">
    <div class="notch-row">
      <div class="notch-pill">
        <div class="notch-dot"></div>
        <div class="notch-cam"></div>
      </div>
    </div>

    <div class="phone-screen">
      <!-- TOAST -->
      <div class="toast" id="toast"></div>

      <!-- VOICE OVERLAY -->
      <div class="voice-overlay" id="voiceOverlay">
        <div class="voice-wave">
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>
        <div class="voice-card">
          <div class="voice-icon" id="overlayIcon">🔊</div>
          <div class="voice-title" id="overlayTitle">Alerta de voz</div>
          <div class="voice-msg" id="overlayMsg">Cargando mensaje…</div>
          <button class="voice-close" onclick="closeVoice()">✓ Entendido</button>
        </div>
      </div>

      <!-- STATUS BAR -->
      <div class="status-bar">
        <span>9:41</span>
        <span>●●●● 🔋</span>
      </div>

      <!-- HEADER -->
      <div class="app-header">
        <div class="header-top">
          <div class="logo">sw<span>a</span>pp</div>
          <div class="header-role">Conductor</div>
        </div>
        <div class="header-meta">
          <div class="route-pill">Ruta CEDIS Norte</div>
          <div class="voice-status">
            <div class="voice-dot"></div>
            Voz activa
          </div>
        </div>
      </div>

      <!-- STATS ROW -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-num" id="stat-paradas" style="color:#F2071B">–</div>
          <div class="stat-label">Paradas</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="stat-criticos" style="color:#8C085E">–</div>
          <div class="stat-label">Críticos</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="stat-avisos" style="color:#F27507">–</div>
          <div class="stat-label">Avisos</div>
        </div>
      </div>

      <div class="scroll-area" id="alertList">
        <div class="section-lbl">Cargando alertas de ruta…</div>
        <!-- cards se inyectan por JS -->
      </div>

      <div class="bottom-nav">
        <div class="bottom-tab active">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          </svg>
          Ruta
        </div>
        <div class="bottom-tab">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/>
          </svg>
          Alertas
        </div>
        <div class="bottom-tab">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
          Historial
        </div>
      </div>

      <div class="home-bar-row"><div class="home-bar"></div></div>
    </div><!-- /phone-screen -->
  </div><!-- /phone-wrap -->

  <div class="demo-label"><span>swapp</span> · Vista Conductor — Demo interactivo</div>
</div>

<script>
// ── CONFIG ─────────────────────────────────────────────────────────────────
const API = 'http://localhost:8000';          // FastAPI ElevenLabs server
const FALLBACK_ALERTS = [
  {
    id:'alert_001', parada:1, tipo:'critico',
    cliente:'Abarrotes Tec #8429', cedis:'CEDIS Norte',
    churn_score:87, sustituciones_mes:5, tasa_sustitucion:72,
    producto_original:'Coca-Cola 600ml ×24', producto_sustituto:'Coca-Cola Sin Azúcar 600ml',
    accion_recomendada:'5 sust. · tasa 72% — ofrece +150 pts al llegar.',
    puntos_compensacion:150, estado:'Crítico',
  },
  {
    id:'alert_002', parada:2, tipo:'critico',
    cliente:'Mini Super Alanis #3120', cedis:'CEDIS Norte',
    churn_score:74, sustituciones_mes:3, tasa_sustitucion:58,
    producto_original:'Agua Ciel 1L ×12', producto_sustituto:'Agua Epura 1L ×12',
    accion_recomendada:'3 sust. · tasa 58% — aparta producto antes de entregar.',
    puntos_compensacion:100, estado:'Crítico',
  },
  {
    id:'alert_003', parada:3, tipo:'aviso',
    cliente:'Tienda Don Pepe #5544', cedis:'CEDIS Norte',
    churn_score:44, sustituciones_mes:1, tasa_sustitucion:31,
    producto_original:'Sprite 600ml ×12', producto_sustituto:null,
    accion_recomendada:'Posible cambio en pedido — avisa al cliente.',
    puntos_compensacion:50, estado:'Riesgo Moderado',
  },
  {
    id:'alert_004', parada:4, tipo:'ok',
    cliente:'Abarrotes Ramírez #2210', cedis:'CEDIS Norte',
    churn_score:12, sustituciones_mes:0, tasa_sustitucion:5,
    producto_original:null, producto_sustituto:null,
    accion_recomendada:null,
    puntos_compensacion:0, estado:'Satisfecho',
  },
  {
    id:'alert_005', parada:5, tipo:'aviso',
    cliente:'Oxxo Periférico #7701', cedis:'CEDIS Norte',
    churn_score:51, sustituciones_mes:2, tasa_sustitucion:40,
    producto_original:'Powerade 600ml ×6', producto_sustituto:'Gatorade 600ml ×6',
    accion_recomendada:'2 sust. — confirma el cambio con el cliente.',
    puntos_compensacion:50, estado:'Riesgo Moderado',
  },
];

// Estado de "apartados"
const apartados = new Set();
// Estado de audio activo
let currentAudio = null;
// Alerts cargados (API o fallback)
let loadedAlerts = [];

// ── LOAD ALERTS ───────────────────────────────────────────────────────────
async function loadAlerts() {
  try {
    const res = await fetch(API + '/alerts', { signal: AbortSignal.timeout(3000) });
    const data = await res.json();
    if (!Array.isArray(data) || data.length === 0) throw new Error('empty');
    loadedAlerts = data;
  } catch {
    loadedAlerts = FALLBACK_ALERTS;
  }
  renderAlerts(loadedAlerts);
}

// ── RENDER ────────────────────────────────────────────────────────────────
function renderAlerts(alerts) {
  // Stats
  const criticos = alerts.filter(a => a.tipo === 'critico').length;
  const avisos   = alerts.filter(a => a.tipo === 'aviso').length;
  document.getElementById('stat-paradas').textContent  = alerts.length;
  document.getElementById('stat-criticos').textContent = criticos;
  document.getElementById('stat-avisos').textContent   = avisos;

  const list = document.getElementById('alertList');
  list.innerHTML = '';

  // Sección críticos
  const crits = alerts.filter(a => a.tipo === 'critico');
  if (crits.length) {
    const lbl = document.createElement('div');
    lbl.className = 'section-lbl';
    lbl.textContent = `Clientes en riesgo crítico (${crits.length})`;
    list.appendChild(lbl);
    crits.forEach(a => list.appendChild(makeCard(a)));
  }

  // Sección avisos
  const aviss = alerts.filter(a => a.tipo === 'aviso');
  if (aviss.length) {
    const lbl = document.createElement('div');
    lbl.className = 'section-lbl';
    lbl.style.marginTop = '4px';
    lbl.textContent = `Avisos de ruta (${aviss.length})`;
    list.appendChild(lbl);
    aviss.forEach(a => list.appendChild(makeCard(a)));
  }

  // Sección ok
  const oks = alerts.filter(a => a.tipo === 'ok');
  if (oks.length) {
    const lbl = document.createElement('div');
    lbl.className = 'section-lbl';
    lbl.style.marginTop = '4px';
    lbl.textContent = `Entrega normal (${oks.length})`;
    list.appendChild(lbl);
    oks.forEach(a => list.appendChild(makeCard(a)));
  }
}

function makeCard(a) {
  const div = document.createElement('div');
  div.className = `alert-card ${a.tipo}`;
  div.id = `card-${a.id}`;

  const riskColor = a.tipo === 'critico' ? '#F2071B' : a.tipo === 'aviso' ? '#F27507' : '#22c55e';
  const scoreW    = Math.min(a.churn_score, 100);

  // Sustitución row
  const sustHTML = a.producto_original ? `
    <div class="sust-row">
      <span></span>
      <span style="flex:1;">
        <span style="text-decoration:${a.producto_sustituto ? 'line-through' : 'none'};color:#aaa;">${a.producto_original}</span>
        ${a.producto_sustituto ? `<span class="sust-arrow">→</span><strong style="color:#F2071B;">${a.producto_sustituto}</strong>` : ''}
      </span>
      ${a.producto_sustituto ? `<span style="background:linear-gradient(to right,#8C085E,#F27507);color:#fff;font-size:9px;font-weight:800;padding:3px 7px;border-radius:20px;">+${a.puntos_compensacion} pts</span>` : ''}
    </div>` : '';

  // Botones según tipo
  const apartadoBtn = (a.tipo === 'critico') ? `
    <button class="btn-apartar" id="btn-ap-${a.id}" onclick="apartar('${a.id}')">
      Apartar
    </button>` : '';

  const waBtn = (a.tipo !== 'ok') ? `
    <button class="btn-wa" id="btn-wa-${a.id}" onclick="enviarWA('${a.id}')">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M11.999 2C6.477 2 2 6.477 2 12c0 1.822.487 3.53 1.338 5L2 22l5.13-1.31A9.96 9.96 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2z"/></svg>
      WhatsApp
    </button>` : '';

  div.innerHTML = `
    <div class="alert-top">
      <div class="stop-num ${a.tipo}">${a.parada}</div>
      <div class="alert-info">
        <div class="alert-cliente">${a.cliente}</div>
        <div class="alert-cedis">${a.cedis}</div>
      </div>
      <div class="alert-badge badge-${a.tipo}">
        ${ a.tipo === 'critico' ? 'Crítico' : a.tipo === 'aviso' ? 'Aviso' : 'Normal' }
      </div>
    </div>

    ${ a.tipo !== 'ok' ? `
    <div class="risk-row">
      <span style="font-size:10px;font-weight:700;color:var(--muted);">Riesgo</span>
      <div class="risk-bar-bg">
        <div class="risk-bar-fill" style="width:${scoreW}%;background:${riskColor};"></div>
      </div>
      <span class="risk-pct" style="color:${riskColor};">${a.churn_score}%</span>
    </div>` : '' }

    ${ a.accion_recomendada ? `
    <div class="detail-row">
      ${a.accion_recomendada}
    </div>` : '' }

    ${sustHTML}

    <div class="action-row">
      <button class="btn-voice" id="btn-v-${a.id}" onclick="playVoice('${a.id}')">
        Escuchar
      </button>
      ${waBtn}
      ${apartadoBtn}
    </div>
  `;
  return div;
}

// ── VOICE PLAYBACK ────────────────────────────────────────────────────────
async function playVoice(alertId) {
  const btn = document.getElementById('btn-v-' + alertId);

  // Busca en los alerts realmente cargados (API o fallback)
  let alert = loadedAlerts.find(a => a.id === alertId) || FALLBACK_ALERTS.find(a => a.id === alertId);

  // Muestra overlay
  triggerVoice(alert);

  // Intenta audio real de ElevenLabs
  try {
    if (btn) { btn.textContent = 'Cargando…'; btn.disabled = true; }
    const res = await fetch(`${API}/alerts/${alertId}/audio`, { signal: AbortSignal.timeout(5000) });
    if (!res.ok) throw new Error('no audio');
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    if (currentAudio) { currentAudio.pause(); URL.revokeObjectURL(currentAudio.src); }
    currentAudio = new Audio(url);
    currentAudio.play();
    if (btn) { btn.className = 'btn-voice playing'; btn.textContent = 'Reproduciendo…'; btn.disabled = false; }
    currentAudio.onended = () => {
      if (btn) { btn.className = 'btn-voice'; btn.textContent = 'Escuchar alerta'; }
    };
  } catch {
    // Sin conexión a ElevenLabs → simula con voz del navegador
    simulateTTS(alert, btn);
  }
}

function triggerVoice(alert) {
  if (!alert) return;
  const icon  = alert.tipo === 'critico' ? '🚨' : alert.tipo === 'aviso' ? '⚠️' : '✅';
  const title = alert.tipo === 'critico' ? '¡Alerta Crítica!' : alert.tipo === 'aviso' ? 'Aviso de Ruta' : 'Entrega Normal';
  const msg   = buildScript(alert);
  document.getElementById('overlayIcon').textContent  = icon;
  document.getElementById('overlayTitle').textContent = title;
  document.getElementById('overlayMsg').textContent   = msg;
  document.getElementById('voiceOverlay').classList.add('active');
}

function closeVoice() {
  document.getElementById('voiceOverlay').classList.remove('active');
  if (currentAudio) { currentAudio.pause(); }
}

function simulateTTS(alert, btn) {
  const script = buildScript(alert);
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(script);
    utt.lang = 'es-MX'; utt.rate = 0.95; utt.pitch = 1;
    // Prefiere voz en español
    const voices = window.speechSynthesis.getVoices();
    const esVoice = voices.find(v => v.lang.startsWith('es'));
    if (esVoice) utt.voice = esVoice;
    utt.onend = () => {
      if (btn) { btn.className = 'btn-voice'; btn.textContent = 'Escuchar alerta'; btn.disabled = false; }
    };
    if (btn) { btn.className = 'btn-voice playing'; btn.textContent = 'Reproduciendo…'; btn.disabled = false; }
    window.speechSynthesis.speak(utt);
  } else {
    showToast('Sin soporte de voz en este navegador');
    if (btn) { btn.className = 'btn-voice'; btn.textContent = 'Escuchar alerta'; btn.disabled = false; }
  }
}

function buildScript(a) {
  if (!a) return '';
  if (a.tipo === 'critico') {
    return `Parada ${a.parada}, alerta crítica. ${a.sustituciones_mes > 0 ? `${a.sustituciones_mes} sustituciones este mes. ` : ''}Ofrece ${a.puntos_compensacion} puntos al cliente.`;
  }
  if (a.tipo === 'aviso') {
    return `Parada ${a.parada}, aviso. Puede haber cambios en el pedido. Informa al cliente y recuérdale sus ${a.puntos_compensacion} puntos.`;
  }
  return `Parada ${a.parada}. Entrega normal, sin cambios.`;
}

// ── ENVIAR WHATSAPP ───────────────────────────────────────────────────────

  const btn = document.getElementById('btn-wa-' + alertId);

  btn.className = 'btn-wa sending';
  btn.textContent = 'Enviando…';
  btn.disabled = true;

  try {
    const res = await fetch(`${API}/alerts/${alertId}/whatsapp`, {
      method: 'POST',
      signal: AbortSignal.timeout(15000),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    btn.dataset.sent = '1';
    btn.className = 'btn-wa';
    btn.style.background = '#128C7E';
    btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M11.999 2C6.477 2 2 6.477 2 12c0 1.822.487 3.53 1.338 5L2 22l5.13-1.31A9.96 9.96 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2z"/></svg> ✅ Enviado`;
    btn.disabled = false;
    showToast('Nota de voz enviada por WhatsApp');
  } catch (err) {
    btn.className = 'btn-wa';
    btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M11.999 2C6.477 2 2 6.477 2 12c0 1.822.487 3.53 1.338 5L2 22l5.13-1.31A9.96 9.96 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2z"/></svg> WhatsApp`;
    btn.disabled = false;
    showToast('Error enviando. Revisar servidor.');
    console.error('WA error:', err);
  }
}

// ── APARTAR PRODUCTO ──────────────────────────────────────────────────────
async function apartar(alertId) {
  const btn = document.getElementById('btn-ap-' + alertId);
  if (apartados.has(alertId)) return;
  apartados.add(alertId);
  if (btn) { btn.className = 'btn-apartar done'; btn.textContent = 'Producto apartado'; }
  showToast('Producto apartado para cliente crítico');

  try {
    const res = await fetch(`${API}/alerts/${alertId}/apartar-audio`);
    if (!res.ok) throw new Error('no audio');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    if (currentAudio) { currentAudio.pause(); URL.revokeObjectURL(currentAudio.src); }
    currentAudio = new Audio(url);
    currentAudio.play();
    currentAudio.onended = () => { currentAudio = null; };
  } catch (e) {
    console.error('Error generando audio de apartar:', e);
  }
}

// ── TOAST ─────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ── INIT ──────────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  // Carga voces del navegador (async en algunos browsers)
  if ('speechSynthesis' in window) window.speechSynthesis.getVoices();
  loadAlerts();
});
</script>
